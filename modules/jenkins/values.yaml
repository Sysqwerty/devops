controller:
  admin:
    username: admin
    password: admin123        # ← consider a Secret instead

  serviceType: LoadBalancer
  servicePort: 80             # external LB port
  targetPort: 8080            # container port Jenkins listens on

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  serviceAccount:
    name: jenkins-sa
    create: false

  JCasC:
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: ${github_user}
                      password: ${github_pat}
                      description: GitHub PAT
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('${github_repo_url}')
                      credentials('github-token')
                    }
                    branches('*/lesson-10')
                  }
                }
                steps {
                  dsl {
                    text: |
                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${github_repo_url}")
                                  credentials("github-token")
                                }
                                branches("*/lesson-10")
                              }
                            }
                          }
                        }
                      }
                  }
                }
              }

# -------------------------------------------------
# Persistence moved to chart-level block
# -------------------------------------------------
persistence:
  enabled: true
  storageClass: "ebs-sc"
  size: "10Gi"